plugins {
    id 'java-library'
    id 'maven-publish'
}

group = project.property('group')
version = project.property('version')

repositories {
    mavenCentral()
}

// The JDK the build and tests run on. Overridden by CI to check newer JDKs; the bytecode always
// targets 17 regardless, via options.release below.
def javaVersion = (project.findProperty('javaVersion') ?: '17').toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api "tools.jackson.core:jackson-databind:${jacksonVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-parameters']
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

// Version metadata read back at runtime by SealedPolymorphismModule.version()
def generateVersionResource = tasks.register('generateVersionResource', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/version/com/github/pjfanning/jackson/sealed/version.properties')
    property 'version', project.version
    property 'groupId', project.group
    property 'artifactId', project.name
}

sourceSets.main.output.dir(layout.buildDirectory.dir('generated/version'), builtBy: generateVersionResource)

tasks.named('processResources') {
    dependsOn generateVersionResource
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'com.github.pjfanning.jackson.sealed'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'jackson-module-java-sealed'
                description = 'Jackson module giving automatic polymorphic serialization to Java 17+ ' +
                        'sealed hierarchies, without @JsonTypeInfo and @JsonSubTypes annotations'
                url = 'https://github.com/pjfanning/jackson-module-java-sealed'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'pjfanning'
                        name = 'PJ Fanning'
                        url = 'https://github.com/pjfanning'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/pjfanning/jackson-module-java-sealed.git'
                    developerConnection = 'scm:git:ssh://git@github.com/pjfanning/jackson-module-java-sealed.git'
                    url = 'https://github.com/pjfanning/jackson-module-java-sealed'
                }
            }
        }
    }
    repositories {
        // Snapshots on the Sonatype Central Portal. Credentials are a Central Portal user token,
        // not the account password. Releases go through a different endpoint and need signing, so
        // they are deliberately not wired up here yet.
        maven {
            name = 'centralSnapshots'
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            credentials {
                username = providers.gradleProperty('centralUsername')
                        .orElse(providers.environmentVariable('CENTRAL_USERNAME')).getOrElse('')
                password = providers.gradleProperty('centralPassword')
                        .orElse(providers.environmentVariable('CENTRAL_PASSWORD')).getOrElse('')
            }
        }
    }
}

tasks.register('printCp') {
    def cp = configurations.compileClasspath
    doLast { println cp.files.join(':') }
}
