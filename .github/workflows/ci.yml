name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the baseline - sealed classes are JEP 409. The others check that the
        # PermittedSubclasses reflection this module relies on still behaves on later JDKs.
        java: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          # The matrix JDK compiles and runs the tests, through a Gradle toolchain. Gradle itself
          # runs on the last entry, which is what becomes JAVA_HOME - so a JDK too new for Gradle
          # to run on can still be tested against.
          java-version: |
            ${{ matrix.java }}
            21

      - name: Point Gradle's toolchain at the matrix JDK
        run: echo "org.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64" >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test
        run: ./gradlew build -PjavaVersion=${{ matrix.java }} --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report-java-${{ matrix.java }}
          path: build/reports/tests/test
          retention-days: 7

  publish-snapshot:
    name: Publish snapshot
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          # 17 builds the artifact, matching the baseline the jar targets; Gradle runs on 21.
          java-version: |
            17
            21

      - name: Point Gradle's toolchain at JDK 17
        run: echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64" >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Check publishing credentials
        id: creds
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: |
          if [ -z "$SONATYPE_USERNAME" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::SONATYPE_USERNAME and SONATYPE_PASSWORD are not set - skipping the snapshot publish.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version is a snapshot
        if: steps.creds.outputs.configured == 'true'
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version"
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "::error::version $version is not a snapshot, refusing to publish it to the snapshot repository"; exit 1 ;;
          esac

      - name: Publish to Sonatype Central snapshots
        if: steps.creds.outputs.configured == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          # Signing is skipped entirely when PGP_SECRET is absent, so the publish still works
          # without a key - but it is present here, so the artifacts go up signed.
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: ./gradlew publishMavenJavaPublicationToCentralSnapshotsRepository --no-daemon
