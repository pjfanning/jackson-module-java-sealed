name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the baseline - sealed classes are JEP 409. The others check that the
        # PermittedSubclasses reflection this module relies on still behaves on later JDKs.
        java: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The matrix JDK compiles and runs the tests, through a Gradle toolchain. Gradle itself
          # runs on the last entry, which is what becomes JAVA_HOME - so a JDK too new for Gradle
          # to run on can still be tested against.
          java-version: |
            ${{ matrix.java }}
            21

      - name: Point Gradle's toolchain at the matrix JDK
        run: echo "org.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64" >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -PjavaVersion=${{ matrix.java }} --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-java-${{ matrix.java }}
          path: build/reports/tests/test
          retention-days: 7
